plugins { id 'eclipse'; id 'idea'; id 'maven-publish'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group='com.tokyoghoul'
version='4.0.0'
base { archivesName='tokyoghoulrpg-4.0.0' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1'; copyIdeResources = true; runs { configureEach { workingDirectory project.file('run'); property 'forge.logging.markers', 'REGISTRIES'; property 'forge.logging.console.level', 'info'; mods { tokyoghoulrpg { source sourceSets.main } } }; client {}; server {} } }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
jar { finalizedBy 'reobfJar' }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
